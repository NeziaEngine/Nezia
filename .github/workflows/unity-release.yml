name: Unity Release

# nezia-ffi をマルチプラットフォームでビルドし、生成された C# バインディングと
# ネイティブライブラリを別リポジトリ (Nezia.Unity) に PR として送り込むワークフロー。
#
# 必要な secret:
#   NEZIA_UNITY_PR_TOKEN — 対象リポジトリへの push / PR 作成権限を持つ PAT。
#                          fine-grained token なら Contents:Write + Pull requests:Write。
#
# 必要な variable (Repository / Organization variables):
#   NEZIA_UNITY_REPO — 対象リポジトリ (default: ${{ github.repository_owner }}/Nezia.Unity)
#   NEZIA_UNITY_BASE_BRANCH — PR の base ブランチ (default: main)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # docs / メタファイルのみの変更ではビルドを走らせない。
    # tag push にも適用されるが、リリースタグは通常コード変更を伴うので問題なし。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ビルドのみ実行し PR は出さない"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Nezia.Unity リポジトリのルートが UPM パッケージ自体なので、PACKAGE_DIR は空 (= リポジトリルート) 。
  PLUGIN_SUBDIR: Runtime/Plugins

jobs:
  # ── プラットフォーム別 ffi ビルド ─────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── デスクトップ ──
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: libnezia.dylib
            kind: desktop
          - label: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact: libnezia.dylib
            kind: desktop
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nezia.dll
            kind: desktop
          - label: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libnezia.so
            kind: desktop
          # ── iOS（staticlib） ──
          # 実機 (arm64)。Unity の iOS Build Support は Plugins/iOS 配下に .a を要求する。
          - label: ios-arm64
            runner: macos-latest
            target: aarch64-apple-ios
            artifact: libnezia.a
            kind: ios
          # ── Android（cdylib） ──
          - label: android-arm64
            runner: ubuntu-latest
            target: aarch64-linux-android
            artifact: libnezia.so
            kind: android
          - label: android-armv7
            runner: ubuntu-latest
            target: armv7-linux-androideabi
            artifact: libnezia.so
            kind: android

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux audio deps
        if: matrix.kind == 'desktop' && matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Android NDK
        if: matrix.kind == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install cargo-ndk
        if: matrix.kind == 'android'
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build ffi (release, desktop)
        if: matrix.kind == 'desktop'
        run: cargo build -p nezia-ffi --release --target ${{ matrix.target }}

      - name: Build ffi (release, iOS staticlib)
        if: matrix.kind == 'ios'
        # iOS は cdylib をリンクできないため staticlib のみビルドする。
        run: cargo rustc -p nezia-ffi --release --target ${{ matrix.target }} --crate-type=staticlib

      - name: Build ffi (release, Android via NDK)
        if: matrix.kind == 'android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        # cpal 0.17 が AAudio を直接リンクするため、libaaudio.so が sysroot に
        # 存在する API 26 (Android 8.0) 以上でビルドする必要がある。
        # 結果として Nezia の Android 最低サポートも API 26 となる。
        run: cargo ndk --target ${{ matrix.target }} --platform 26 -- build -p nezia-ffi --release

      - name: Stage native artifact
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "staging/${{ matrix.artifact }}"

      - name: Stage generated C# bindings (linux only)
        # csbindgen 出力はターゲット非依存なので、どこか 1 つだけ拾えばよい。
        if: matrix.label == 'linux-x86_64'
        shell: bash
        run: |
          cp crates/ffi/bindings/NeziaNative.g.cs staging/NeziaNative.g.cs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nezia-${{ matrix.label }}
          path: staging/
          if-no-files-found: error

  # ── preview daemon + nezia-cli (Editor 試聴用ツール、デスクトップのみ) ──────
  build-tools:
    name: Build tools (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: tools-macos
            runner: macos-latest
            daemon_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            go_os: darwin
            go_archs: "arm64 amd64"
            exe: ""
          - label: tools-windows
            runner: windows-latest
            daemon_targets: "x86_64-pc-windows-msvc"
            go_os: windows
            go_archs: "amd64"
            exe: ".exe"
          - label: tools-linux
            runner: ubuntu-latest
            daemon_targets: "x86_64-unknown-linux-gnu"
            go_os: linux
            go_archs: "amd64"
            exe: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # ターゲット追加はビルドループ内の rustup target add で行う
        # (matrix.daemon_targets がスペース区切りのため)。
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (daemon build.rs が要求)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux audio deps
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Go (nezia-cli)
        uses: actions/setup-go@v5
        with:
          go-version-file: nezia-cli/go.mod

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: tools-${{ matrix.label }}

      - name: Build nezia-daemon (release)
        shell: bash
        run: |
          set -euo pipefail
          for t in ${{ matrix.daemon_targets }}; do
            rustup target add "$t"
            cargo build -p nezia-daemon --release --target "$t"
          done

      - name: Build nezia-cli (release)
        shell: bash
        working-directory: nezia-cli
        run: |
          set -euo pipefail
          mkdir -p ../staging-tools
          version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          for a in ${{ matrix.go_archs }}; do
            GOOS=${{ matrix.go_os }} GOARCH="$a" CGO_ENABLED=0 \
              go build -ldflags "-X jp.nezia/nezia-cli/internal/command.version=$version" \
              -o "../staging-tools/nezia-cli-$a${{ matrix.exe }}" ./cmd/nezia-cli
          done

      - name: Stage daemon binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-tools
          for t in ${{ matrix.daemon_targets }}; do
            cp "target/$t/release/nezia-daemon${{ matrix.exe }}" \
               "staging-tools/nezia-daemon-$t${{ matrix.exe }}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nezia-${{ matrix.label }}
          path: staging-tools/
          if-no-files-found: error

  # ── 生成物を Nezia.Unity リポジトリへ PR ─────────────────────────────────
  publish:
    name: Publish PR to Nezia.Unity
    needs: [build, build-tools]
    runs-on: macos-latest # universal binary を作るため macOS で実行
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}

    steps:
      - name: Resolve target repo settings
        id: cfg
        shell: bash
        run: |
          target_repo="${{ vars.NEZIA_UNITY_REPO }}"
          if [ -z "$target_repo" ]; then
            target_repo="${{ github.repository_owner }}/Nezia.Unity"
          fi
          base_branch="${{ vars.NEZIA_UNITY_BASE_BRANCH }}"
          if [ -z "$base_branch" ]; then
            base_branch="main"
          fi
          echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          # PR ブランチ名は固定。既存 PR があれば追記コミットで更新する運用。
          short_sha="${GITHUB_SHA::7}"
          echo "pr_branch=automation/nezia-core" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo (for commit metadata)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout Nezia.Unity repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.target_repo }}
          token: ${{ secrets.NEZIA_UNITY_PR_TOKEN }}
          path: target
          ref: ${{ steps.cfg.outputs.base_branch }}
          fetch-depth: 0

      - name: Switch to PR branch (existing or new)
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          branch="${{ steps.cfg.outputs.pr_branch }}"
          base="${{ steps.cfg.outputs.base_branch }}"
          git fetch origin "$branch" || true
          if git rev-parse --verify "origin/$branch" >/dev/null 2>&1; then
            echo "existing branch found, appending commits"
            git checkout -B "$branch" "origin/$branch"
          else
            echo "no existing branch, branching from $base"
            git checkout -B "$branch" "origin/$base"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Unity package contents
        shell: bash
        run: |
          set -euo pipefail
          pkg="target"
          plugin_root="$pkg/${{ env.PLUGIN_SUBDIR }}"
          mkdir -p \
            "$plugin_root/macOS" \
            "$plugin_root/Windows/x86_64" \
            "$plugin_root/Linux/x86_64" \
            "$plugin_root/iOS" \
            "$plugin_root/Android/arm64-v8a" \
            "$plugin_root/Android/armeabi-v7a"

          # macOS: arm64 + x86_64 を universal binary に結合
          lipo -create \
            artifacts/nezia-macos-arm64/libnezia.dylib \
            artifacts/nezia-macos-x86_64/libnezia.dylib \
            -output "$plugin_root/macOS/libnezia.dylib"
          lipo -info "$plugin_root/macOS/libnezia.dylib"

          cp artifacts/nezia-windows-x86_64/nezia.dll "$plugin_root/Windows/x86_64/nezia.dll"
          cp artifacts/nezia-linux-x86_64/libnezia.so "$plugin_root/Linux/x86_64/libnezia.so"

          # iOS は arm64 device static library のみ（シミュレータは将来 XCFramework で対応）
          cp artifacts/nezia-ios-arm64/libnezia.a "$plugin_root/iOS/libnezia.a"

          # Android: ABI 別ディレクトリに配置（Unity の Android Plugin Inspector 標準レイアウト）
          cp artifacts/nezia-android-arm64/libnezia.so   "$plugin_root/Android/arm64-v8a/libnezia.so"
          cp artifacts/nezia-android-armv7/libnezia.so   "$plugin_root/Android/armeabi-v7a/libnezia.so"

          # C# バインディング（自動生成物は Generated/ 配下にまとめる）
          mkdir -p "$pkg/Runtime/Generated"
          cp artifacts/nezia-linux-x86_64/NeziaNative.g.cs "$pkg/Runtime/Generated/NeziaNative.g.cs"

          # ── preview ツール (daemon + cli) を Editor/Bin~ に配置 ──
          # チルダフォルダは Unity のアセット DB から除外されるため、.exe が
          # PluginImporter に誤って取り込まれない (Samples~ と同じ規約)。
          # Editor 側は PackageInfo.resolvedPath ベースのファイルパス解決なので
          # アセット DB 外でも見つけられる。
          tools_root="$pkg/Editor/Bin~"
          mkdir -p "$tools_root/macOS" "$tools_root/Windows" "$tools_root/Linux"

          lipo -create \
            artifacts/nezia-tools-macos/nezia-daemon-aarch64-apple-darwin \
            artifacts/nezia-tools-macos/nezia-daemon-x86_64-apple-darwin \
            -output "$tools_root/macOS/nezia-daemon"
          lipo -create \
            artifacts/nezia-tools-macos/nezia-cli-arm64 \
            artifacts/nezia-tools-macos/nezia-cli-amd64 \
            -output "$tools_root/macOS/nezia-cli"

          cp artifacts/nezia-tools-windows/nezia-daemon-x86_64-pc-windows-msvc.exe \
             "$tools_root/Windows/nezia-daemon.exe"
          cp artifacts/nezia-tools-windows/nezia-cli-amd64.exe \
             "$tools_root/Windows/nezia-cli.exe"

          cp artifacts/nezia-tools-linux/nezia-daemon-x86_64-unknown-linux-gnu \
             "$tools_root/Linux/nezia-daemon"
          cp artifacts/nezia-tools-linux/nezia-cli-amd64 \
             "$tools_root/Linux/nezia-cli"

          chmod +x "$tools_root/macOS/"* "$tools_root/Linux/"*

          # バージョン情報を VERSION.txt に書いて差分を可視化
          {
            echo "source-repo: ${{ github.repository }}"
            echo "source-sha: ${{ github.sha }}"
            echo "source-ref: ${{ github.ref }}"
            echo "built-at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tools: nezia-daemon + nezia-cli (Editor/Bin~/{macOS,Windows,Linux})"
          } > "$pkg/VERSION.txt"

      - name: Commit & push (no force)
        id: push
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name  "nezia-core-bot"
          git config user.email "nezia-core-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update nezia-core artifacts to ${{ steps.cfg.outputs.short_sha }}

          source: ${{ github.repository }}@${{ github.sha }}"
          git push origin "${{ steps.cfg.outputs.pr_branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update Pull Request
        if: steps.push.outputs.changed == 'true'
        id: pr
        shell: bash
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.NEZIA_UNITY_PR_TOKEN }}
        run: |
          set -euo pipefail
          branch="${{ steps.cfg.outputs.pr_branch }}"
          base="${{ steps.cfg.outputs.base_branch }}"
          title="chore: update nezia-core artifacts to ${{ steps.cfg.outputs.short_sha }}"
          body=$(cat <<'EOF'
          Automated update of `nezia-core` native plugins and C# bindings.

          - **source repo**: `${{ github.repository }}`
          - **source ref**: `${{ github.ref }}`
          - **source sha**: `${{ github.sha }}`

          ### Included artifacts
          - `${{ env.PLUGIN_SUBDIR }}/macOS/libnezia.dylib` (universal: arm64 + x86_64)
          - `${{ env.PLUGIN_SUBDIR }}/Windows/x86_64/nezia.dll`
          - `${{ env.PLUGIN_SUBDIR }}/Linux/x86_64/libnezia.so`
          - `${{ env.PLUGIN_SUBDIR }}/iOS/libnezia.a` (arm64 device, static)
          - `${{ env.PLUGIN_SUBDIR }}/Android/arm64-v8a/libnezia.so`
          - `${{ env.PLUGIN_SUBDIR }}/Android/armeabi-v7a/libnezia.so`
          - `Runtime/Generated/NeziaNative.g.cs`
          EOF
          )
          existing=$(gh pr list --head "$branch" --state open --json number -q '.[0].number' || true)
          if [ -z "$existing" ]; then
            url=$(gh pr create --base "$base" --head "$branch" \
              --title "$title" --body "$body" \
              --label automation --label nezia-core)
            number=$(gh pr view "$url" --json number -q '.number')
          else
            gh pr edit "$existing" --title "$title" --body "$body" >/dev/null
            url=$(gh pr view "$existing" --json url -q '.url')
            number="$existing"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "PR URL: ${{ steps.pr.outputs.url }}"
          echo "PR Number: ${{ steps.pr.outputs.number }}"
          echo "Changed: ${{ steps.push.outputs.changed }}"
